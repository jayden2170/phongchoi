<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Battle</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container">

    <div class="hero">

        <div class="hero-icon">
            🎮
        </div>

        <h1>QUIZ BATTLE</h1>

        <p>
            Đấu trí cùng bạn bè
        </p>

    </div>


    <div class="cards">

        <!-- TẠO PHÒNG -->

        <div class="card">

            <div class="card-icon">
                🏠
            </div>

            <h2>
                Tạo phòng
            </h2>

            <p>
                Tạo một phòng mới
                và mời bạn bè cùng chơi.
            </p>

            <form
                action="/create"
                method="POST"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Tên của bạn"
                    maxlength="20"
                    required
                >

                <button type="submit">
                    🚀 Tạo phòng
                </button>

            </form>

        </div>


        <!-- VÀO PHÒNG -->

        <div class="card">

            <div class="card-icon">
                🚪
            </div>

            <h2>
                Vào phòng
            </h2>

            <p>
                Nhập mã phòng để
                tham gia cùng bạn bè.
            </p>

            <form
                action="/join"
                method="POST"
            >

                <input
                    type="text"
                    name="name"
                    placeholder="Tên của bạn"
                    maxlength="20"
                    required
                >

                <input
                    type="text"
                    name="code"
                    placeholder="Mã phòng"
                    maxlength="6"
                    required
                    style="text-transform: uppercase;"
                >

                <button type="submit">
                    🎯 Vào phòng
                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
