<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cài đặt phòng</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<div class="container settings-container">

    <div class="hero">

        <div class="hero-icon">
            ⚙️
        </div>

        <h1>
            CÀI ĐẶT PHÒNG
        </h1>

        <p>
            Thiết lập trò chơi trước khi bắt đầu
        </p>

    </div>


    <div class="settings-card">

        <form
            action="/create-room"
            method="POST"
            id="settingsForm"
        >

            <input
                type="hidden"
                name="name"
                value="{{ player_name }}"
            >


            <!-- MÔN -->

            <div class="setting-group">

                <label>
                    📚 Môn học
                </label>

                <select
                    name="subject"
                    id="subject"
                    required
                >

                    {% for subject in subjects %}

                    <option value="{{ subject }}">
                        {{ subject }}
                    </option>

                    {% endfor %}

                </select>

            </div>


            <!-- SỐ CÂU -->

            <div class="setting-group">

                <label>
                    📝 Số câu hỏi
                </label>

                <input
                    type="number"
                    name="question_count"
                    value="20"
                    min="1"
                    max="200"
                    required
                >

                <small>
                    Số câu thực tế sẽ không vượt quá
                    số câu có trong môn đã chọn.
                </small>

            </div>


            <!-- THỜI GIAN -->

            <div class="setting-group">

                <label>
                    ⏱️ Thời gian mỗi câu
                </label>

                <div class="input-with-unit">

                    <input
                        type="number"
                        name="question_time"
                        value="15"
                        min="5"
                        max="120"
                        required
                    >

                    <span>
                        giây
                    </span>

                </div>

                <small>
                    Từ 5 đến 120 giây.
                </small>

            </div>


            <!-- GIỚI HẠN NGƯỜI -->

            <div class="setting-group">

                <label>
                    👥 Giới hạn người chơi
                </label>

                <div class="input-with-unit">

                    <input
                        type="number"
                        name="max_players"
                        value="20"
                        min="1"
                        max="100"
                        required
                    >

                    <span>
                        người
                    </span>

                </div>

            </div>


            <!-- XEM TRƯỚC -->

            <div class="settings-preview">

                <h3>
                    📋 Tóm tắt
                </h3>

                <p>
                    Người tạo:
                    <strong>
                        {{ player_name }}
                    </strong>
                </p>

                <p>
                    Môn:
                    <strong id="previewSubject">
                        {{ subjects[0] if subjects else "Mặc định" }}
                    </strong>
                </p>

            </div>


            <div class="settings-actions">

                <a
                    href="/"
                    class="secondary-button"
                >
                    ← Quay lại
                </a>

                <button
                    type="submit"
                    class="start-button"
                >
                    🚀 Tạo phòng
                </button>

            </div>

        </form>

    </div>

</div>


<script>

const subject =
    document.getElementById("subject");

const previewSubject =
    document.getElementById("previewSubject");

subject.addEventListener(
    "change",
    () => {

        previewSubject.innerText =
            subject.value;

    }
);

</script>

</body>

</html>
