<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Phòng Chơi - Quiz Battle</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="hero">

            <h1>🎮 PHÒNG CHƠI</h1>

            <p>
                Quiz Battle - Đấu trí cùng bạn bè
            </p>

        </div>


        <div class="cards">


            <!-- TẠO PHÒNG -->

            <div class="card">

                <h2>🏠 Tạo phòng</h2>

                <p>
                    Tạo một phòng mới và mời bạn bè.
                </p>

                <form
                    action="/create"
                    method="POST"
                >

                    <input
                        type="text"
                        name="name"
                        placeholder="Tên của bạn"
                        maxlength="20"
                        required
                    >

                    <button type="submit">
                        Tạo phòng
                    </button>

                </form>

            </div>


            <!-- VÀO PHÒNG -->

            <div class="card">

                <h2>🚪 Vào phòng</h2>

                <p>
                    Nhập mã phòng để tham gia.
                </p>

                <form
                    action="/join"
                    method="POST"
                >

                    <input
                        type="text"
                        name="name"
                        placeholder="Tên của bạn"
                        maxlength="20"
                        required
                    >

                    <input
                        type="text"
                        name="code"
                        placeholder="Mã phòng"
                        maxlength="6"
                        required
                    >

                    <button type="submit">
                        Vào phòng
                    </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
